steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/spanish-app/spanish-app:$BUILD_ID'
      - '.'

  # 2. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/spanish-app/spanish-app:$BUILD_ID'

  # 3. Deploy the image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'spanish-app'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/spanish-app/spanish-app:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'spanish-app-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      - '--timeout'
      - '3600'
      - '--no-cpu-throttling'
      - '--set-secrets'
      - 'SECRET_KEY=django-secret-key:latest,GEMINI_API_KEY=gemini-api-key:latest,DATABASE_URL=database-url:latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/spanish-app/spanish-app:$BUILD_ID'
